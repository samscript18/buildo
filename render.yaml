# Configure secrets in the Render dashboard; this file contains names only.
services:
  - type: web
    name: buildo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:indexes:hosted && npm run start:render
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 180
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: LUX3D_API_KEY
        sync: false
      - key: LUX3D_DOWNLOAD_HOSTS
        value: qhsmodel.kujiale.com
